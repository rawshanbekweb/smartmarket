# SMART MARKET — local / staging stack
#   cp .env.example .env   (fill in secrets)
#   docker compose up -d --build
#   docker compose exec -e BOOTSTRAP_CHIEF_PASSWORD='...' api node dist/cli/bootstrap.js --market "..." --name "..." --username rahbar
#   docker compose exec api node dist/demo/seedCli.js   # DEMO data only, requires DEMO_MODE=true (never in production)
#   open http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: smart_market
      POSTGRES_USER: smart_market
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432" # host 5433 to avoid clashing with a local PostgreSQL
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smart_market -d smart_market"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DEMO_MODE: ${DEMO_MODE:-false}
      DATABASE_URL: postgresql://smart_market:${POSTGRES_PASSWORD}@db:5432/smart_market?schema=public
      API_PORT: 4000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_EXPIRES_IN_HOURS: ${JWT_EXPIRES_IN_HOURS:-12}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      VISION_API_KEY: ${VISION_API_KEY:?set VISION_API_KEY in .env}
      ALERT_WORKER_INTERVAL_SECONDS: ${ALERT_WORKER_INTERVAL_SECONDS:-15}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  pgdata:
