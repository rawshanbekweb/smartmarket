# Render Blueprint — free hosting for the pilot (see docs/DEPLOY-FREE.md).
# Render dashboard → New → Blueprint → select this repository.
services:
  - type: web
    name: smartmarket
    runtime: docker
    plan: free
    region: frankfurt # closest Render region to Uzbekistan
    dockerfilePath: ./infrastructure/docker/app.Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    # Deploys are triggered by GitHub Actions after CI passes (deploy hook).
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: "false"
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY_HOPS
        value: "1" # verify after first login: Audit log must show your real IP (docs/DEPLOY-FREE.md)
      - key: JWT_SECRET
        generateValue: true
      - key: VISION_API_KEY
        generateValue: true
      # Supabase session pooler URLs — entered in the dashboard, never committed
      - key: DATABASE_URL
        sync: false
      - key: MIGRATE_DATABASE_URL
        sync: false
      # https://<service-name>.onrender.com (or your domain later)
      - key: CORS_ORIGINS
        sync: false
